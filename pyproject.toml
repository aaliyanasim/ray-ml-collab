[project]
name = "ray-ml-collab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.67.1",
    "joblib>=1.6.0",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "ipykernel>=7.4.0",
    "jupytext>=1.19.5",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

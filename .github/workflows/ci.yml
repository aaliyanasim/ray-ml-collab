name: CI

# Runs on every pull request into the protected branches, and on pushes to dev.
# Phase 8: a deliberately broken test must turn this red and block merging.

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python and dependencies
        run: |
          uv python install "$PYTHON_VERSION"
          uv sync --frozen --python "$PYTHON_VERSION"

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python and dependencies
        run: |
          uv python install "$PYTHON_VERSION"
          uv sync --frozen --python "$PYTHON_VERSION"

      - name: pytest
        run: uv run pytest -q

  smoke-train:
    name: Smoke train + data checks
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python and dependencies
        run: |
          uv python install "$PYTHON_VERSION"
          uv sync --frozen --python "$PYTHON_VERSION"

      # The real dataset is ~759 MB and lives behind DVC. CI uses a small,
      # deterministic synthetic sample with the same shape instead.
      - name: Generate synthetic sample
        run: uv run python tests/sample_data.py --out data/raw/sample.csv

      - name: Prepare -> train -> evaluate
        run: |
          uv run python src/prepare.py \
            --raw-data data/raw/sample.csv \
            --train-out data/processed/train.csv \
            --test-out data/processed/test.csv
          uv run python src/train.py \
            --train-data data/processed/train.csv \
            --model-out models/model.joblib
          uv run python src/evaluate.py \
            --test-data data/processed/test.csv \
            --model models/model.joblib \
            --metrics-out metrics.json

      - name: Data quality checks (schema / ranges / nulls)
        run: uv run python src/data_checks.py --data data/processed/train.csv

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: smoke-train-metrics
          path: metrics.json

      # Bonus: paste metrics.json as a PR comment via CML. Non-blocking.
      - name: Build metrics report
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "## Smoke-train metrics";
            echo "";
            echo '```json';
            cat metrics.json;
            echo '```';
          } > report.md

      - name: Publish metrics comment (CML)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes @dvcorg/cml comment create report.md
